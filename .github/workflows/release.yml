name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Package and release
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          # No CF_API_KEY / WOWI_API_TOKEN / WAGO_API_TOKEN: this addon isn't
          # published to CurseForge, WoWInterface or Wago, so the packager
          # just attaches the zip to the GitHub release.
