name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1"

      - uses: leafo/gh-actions-luarocks@v6

      - name: Install luacheck
        run: luarocks install luacheck

      - name: Luacheck
        run: luacheck .

      # Offline suite: the resolver is stubbed, so no game client is needed.
      - name: Tests
        run: lua Tests/run.lua

      # Dry run only: validates .pkgmeta, TOC directives and keyword
      # substitution without uploading anything or needing credentials. Catches
      # packaging regressions (e.g. #3) on every PR instead of only at release.
      - name: Package (dry run)
        uses: BigWigsMods/packager@v2
        with:
          args: -d
