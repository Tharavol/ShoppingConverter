name: Release

on:
  push:
    tags:
      # Stable releases only -- v1.2.0-alpha.1 etc. go through prerelease.yml
      # instead, so the two workflows never both fire on the same tag.
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Package and release
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          # No CF_API_KEY / WOWI_API_TOKEN / WAGO_API_TOKEN: this addon isn't
          # published to CurseForge, WoWInterface or Wago, so the packager
          # just attaches the zip to the GitHub release.

      # CI's dry-run build verifies layout too, but it skips itself on this
      # exact commit (see ci.yml) since packager won't double-build a tagged
      # commit. This is the only place the archive that actually ships gets
      # checked.
      - name: Verify archive layout
        run: |
          zip=$(ls .release/*.zip)
          unzip -l "$zip"
          unzip -l "$zip" | grep -q 'ShoppingConverter/ShoppingConverter.toc'
          unzip -l "$zip" | grep -q 'ShoppingConverter/Core.lua'
          unzip -l "$zip" | grep -q 'ShoppingConverter/Converter.lua'
          unzip -l "$zip" | grep -q 'ShoppingConverter/Resolver.lua'
          unzip -l "$zip" | grep -q 'ShoppingConverter/UI.lua'
          unzip -l "$zip" | grep -q 'ShoppingConverter/Libs/LibStub'

          if unzip -l "$zip" | grep -q 'ShoppingConverter/Tests/'; then
            echo "Tests/ should not ship in the release archive (see .pkgmeta)" >&2
            exit 1
          fi
          if unzip -l "$zip" | grep -q 'ShoppingConverter/CHANGELOG.md'; then
            echo "CHANGELOG.md should not ship in the release archive (see .pkgmeta)" >&2
            exit 1
          fi
