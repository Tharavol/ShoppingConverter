name: TOC Interface Check

on:
  schedule:
    - cron: "43 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Retail and WoW Forever, no beta/PTR. The updater rewrites the whole Interface
      # line from these flavors, so a flavor left out loses its version. Keep `|`
      # (not `|-`): the action drops the last line when it has no trailing newline.
      - name: Update TOC Interface version
        uses: p3lim/toc-interface-updater@v4
        with:
          flavor: |
            retail
            forever

      - name: Commit if the Interface version changed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -- "*.toc"
            git commit -m "Bump TOC Interface version"
            git push
          fi
